name: Repair npm lockfile metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          const pkg = JSON.parse(await readFile('package.json', 'utf8'))
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'))
          for (const [actual, expected, label] of [
            [lock.name, pkg.name, 'lockfile name'],
            [lock.version, pkg.version, 'lockfile version'],
            [lock.packages?.['']?.name, pkg.name, 'root package name'],
            [lock.packages?.['']?.version, pkg.version, 'root package version'],
          ]) {
            if (actual !== expected) throw new Error(`${label}: expected ${expected}, got ${actual}`)
          }
          NODE
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: synchronize npm lockfile metadata'
          git push
